# kitty.conf - Generated by Confitty (2026-04-23)
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

# --- Fonts ---
font_family JetBrains Mono
font_size 12
disable_ligatures cursor

# --- Cursor ---
cursor_shape block
cursor_blink_interval 0.75
cursor_underline_thickness 1.125

# --- Scrollback ---
scrollback_lines 10000

# --- Mouse ---
copy_on_select clipboard

# --- Bell ---
enable_audio_bell no

# --- Window Layout ---
window_border_width 1pt
active_border_color #f5c2e7
inactive_text_alpha 0.7
confirm_os_window_close 1

# --- Tab Bar ---
tab_bar_edge top
active_tab_foreground #1e1e2e
active_tab_background #f5c2e7
inactive_tab_foreground #a6adc8
inactive_tab_background #313244

# --- Colors ---
foreground #cdd6f4
background #1e1e2e
selection_foreground #1e1e2e
selection_background #585b70
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8
cursor #cdd6f4
cursor_text_color #1e1e2e
url_color #89b4fa

# --- OS Specific ---
linux_display_server wayland

tab_bar_style powerline
tab_powerline_style round
wayland_titlebar_color #1e1e2e
confirm_os_window_close 0
editor kate
dynamic_background_opacity yes
background_opacity 0
